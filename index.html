<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOCOPANI • Gerar Key</title><style>:root{color-scheme:dark;--bg:#090b12;--line:#292f45;--accent:#a78bfa;--text:#f5f3ff;--muted:#aaa9c0}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font:16px/1.5 system-ui,sans-serif;color:var(--text);background:radial-gradient(ellipse at top,#24184b,var(--bg) 55%)}main{width:min(100%,480px);padding:28px;border:1px solid var(--line);border-radius:22px;background:#141827;box-shadow:0 20px 70px #0008}.brand{color:var(--accent);font-weight:800;letter-spacing:.16em;font-size:.8rem}h1{margin:.4rem 0;font-size:1.8rem}p,small{color:var(--muted)}label{display:block;margin:20px 0 6px;font-weight:650}input,button{width:100%;border-radius:12px;padding:13px 14px;font:inherit}input{color:var(--text);background:#0d1020;border:1px solid var(--line)}button{margin-top:14px;color:#170f2c;background:var(--accent);border:0;font-weight:800;cursor:pointer}#status{margin-top:16px;white-space:pre-wrap}.key{display:none;margin-top:18px;padding:14px;border:1px dashed var(--accent);border-radius:12px;overflow-wrap:anywhere;font-weight:800}.key button{background:#292341;color:var(--text)}</style></head><body><main><div class="brand">LOCOPANI • CRISTAL ROXO 777</div><h1>Gerar sua key</h1><p>Informe seu Roblox UserId. Você irá ao Linkvertise e, ao retornar com a validação aprovada, receberá uma key individual.</p><form id="form"><label for="robloxId">Roblox UserId</label><input id="robloxId" inputmode="numeric" autocomplete="off" pattern="[0-9]{1,20}" required placeholder="Ex.: 123456789"><button id="start" type="submit">Continuar pelo Linkvertise</button></form><div id="status" role="status"></div><div id="keyBox" class="key"><div>Sua key:</div><div id="keyText"></div><button id="copy" type="button">Copiar key</button><small>Guarde-a e ative no LOCOPANI.</small></div></main><script>
const URL="https://hshqmleifwkvzjrefabj.supabase.co";
const PUBLIC_KEY="const PUBLIC_KEY="sb_publishable_ABGrc7jkuoPYKwMlx9ihCg_RuM3u235";";
const statusEl=document.getElementById("status"),form=document.getElementById("form");
async function call(path,body){const r=await fetch(`${URL}/functions/v1/${path}`,{method:"POST",headers:{"Content-Type":"application/json","apikey":PUBLIC_KEY,"Authorization":`Bearer ${PUBLIC_KEY}`},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Falha ao contactar o servidor.");return d;}
form.addEventListener("submit",async e=>{e.preventDefault();const id=document.getElementById("robloxId").value.trim();if(!/^[0-9]{1,20}$/.test(id)){statusEl.textContent="UserId inválido.";return;}const btn=document.getElementById("start");btn.disabled=true;statusEl.textContent="Preparando acesso...";try{const d=await call("linkvertise-start",{roblox_user_id:id});localStorage.setItem("locopani_lv_session",d.session_id);window.location.href=d.redirect_url;}catch(err){statusEl.textContent=err.message;btn.disabled=false;}});
async function returned(){const hash=new URLSearchParams(location.search).get("hash");if(!hash)return;const sid=localStorage.getItem("locopani_lv_session");if(!sid){statusEl.textContent="Sessão não encontrada neste navegador. Comece novamente.";return;}form.style.display="none";statusEl.textContent="Validando Linkvertise...";try{const d=await call("linkvertise-redeem",{session_id:sid,hash});document.getElementById("keyText").textContent=d.key;document.getElementById("keyBox").style.display="block";statusEl.textContent=`Acesso confirmado para Roblox UserId ${d.roblox_user_id}.`;localStorage.removeItem("locopani_lv_session");history.replaceState({},"",location.pathname);}catch(err){statusEl.textContent=err.message;form.style.display="block";}}
document.getElementById("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(document.getElementById("keyText").textContent);statusEl.textContent="Key copiada!";}catch{statusEl.textContent="Selecione e copie a key manualmente.";}});returned();
</script></body></html>
